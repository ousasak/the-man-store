[build]
  command = "npm run build"
  publish = "dist"

# Browser SPA calls Railway `/api` directly (see backendOrigin.js) to avoid Netlify ~26s 504.
# These redirects still help non-browser clients hitting fitandsleek.online/api/*.
[[redirects]]
  from = "/api/*"
  to = "https://fitandsleek-official-v2-production.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA: React Router paths must fall back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
