[www]
; Inherit container env (DATABASE_URL after entrypoint quote-strip).
; Do not set env[DATABASE_URL]=$DATABASE_URL — an empty expansion would hide .env.
clear_env = no
pm = dynamic
; Render Free (~512MB): avoid OOM from too many concurrent Laravel workers.
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 300
