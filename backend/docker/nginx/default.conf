# Browser storefront (www.fitandsleek.online) calls this path with Origin;
# a static 200 without CORS is blocked. Railway healthchecks send no Origin.
map $http_origin $health_cors_origin {
    default "";
    "~*^https://(www\.)?fitandsleek\.online$" $http_origin;
    "~*^https://[a-z0-9.-]+\.vercel\.app$" $http_origin;
    "~*^https://[a-z0-9.-]+\.netlify\.app$" $http_origin;
}

server {
    listen 8000;
    listen [::]:8000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;
    charset utf-8;

    # Security headers (API + static). Enable HSTS when clients use HTTPS end-to-end.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Do not set a global CSP here — it breaks Laravel welcome/error pages and static assets.
    # API routes return JSON; the SPA is served from the frontend container (:5173).

    # Railway healthcheck must not wait on PHP/Laravel boot (otherwise: service unavailable).
    location = /api/health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin $health_cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        return 200 '{"ok":true}';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
